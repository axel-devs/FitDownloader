<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FitDownloader — Manager</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        margin: 0;
        padding: 0;
        background: #0d0d10;
        color: #f5f5f5;
      }

      #app {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 24px;
      }

      #header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #282838;
      }

      #header h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 600;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #stop-all-button {
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 5px;
        border: 1px solid #e53935;
        background: #e53935;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      #stop-all-button.blocked {
        background: #43a047;
        border-color: #43a047;
      }

      #blocked-banner {
        display: none;
        padding: 10px 16px;
        margin-bottom: 16px;
        border-radius: 8px;
        background: #2d1515;
        border: 1px solid #e53935;
        font-size: 14px;
        color: #ff8a80;
        text-align: center;
      }

      #blocked-banner.visible {
        display: block;
      }

      .session-card {
        background: #15151c;
        border: 1px solid #282838;
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
      }

      .session-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #1a1a24;
        border-bottom: 1px solid #282838;
      }

      .session-title {
        font-weight: 600;
        font-size: 14px;
        color: #f78da7;
      }

      .session-meta {
        font-size: 12px;
        color: #9e9eaf;
      }

      .session-items {
        padding: 8px 12px;
        max-height: 400px;
        overflow-y: auto;
        overscroll-behavior-y: auto;
      }

      .item-row {
        display: flex;
        align-items: center;
        padding: 6px 8px;
        border-radius: 4px;
        margin-bottom: 2px;
        flex-wrap: wrap;
      }

      .item-row:hover {
        background: #1c1c28;
      }

      .item-label {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        font-size: 13px;
      }

      .item-status {
        font-size: 12px;
        margin-left: 8px;
        opacity: 0.9;
        white-space: nowrap;
      }

      .status-queued { color: #9e9eaf; }
      .status-starting { color: #fdd835; }
      .status-downloading { color: #fdd835; }
      .status-completed { color: #81c784; }
      .status-error { color: #e57373; }
      .status-cancelled { color: #9e9eaf; }
      .status-stopped { color: #ff8a80; }

      .item-actions {
        display: flex;
        gap: 4px;
        margin-left: 8px;
      }

      .item-actions button {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 3px;
        cursor: pointer;
        border: 1px solid #444;
        background: #222;
        color: #ccc;
      }

      .item-actions button:hover {
        background: #333;
        color: #fff;
      }

      .item-actions .btn-item-retry { border-color: #43a047; color: #81c784; }
      .item-actions .btn-item-cancel { border-color: #e53935; color: #e57373; }
      .item-actions .btn-item-resume { border-color: #43a047; color: #81c784; }
      .item-actions .btn-item-open { border-color: #64b5f6; color: #64b5f6; }

      .progress-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        padding-left: 8px;
      }

      .progress-bar-container {
        flex: 1;
        height: 5px;
        background: #2a2a3a;
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        background: #f78da7;
        border-radius: 3px;
        transition: width 0.3s ease;
      }

      .progress-text {
        font-size: 11px;
        color: #9e9eaf;
        white-space: nowrap;
        min-width: 100px;
        text-align: right;
      }

      .session-progress {
        padding: 8px 16px;
        border-top: 1px solid #282838;
      }

      .session-progress .progress-bar-container {
        height: 6px;
        margin-bottom: 4px;
      }

      .session-progress-text {
        font-size: 12px;
        color: #c0c0d0;
      }

      .session-counts {
        font-size: 12px;
        color: #9e9eaf;
        padding: 6px 16px;
        border-top: 1px solid #282838;
      }

      #no-sessions {
        text-align: center;
        color: #9e9eaf;
        padding: 40px 20px;
        font-size: 14px;
      }


      button {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #f78da7;
        background: #f78da7;
        color: #0b0b10;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="header">
        <h1>FitDownloader — Download Manager</h1>
        <div class="header-controls">
          <button id="stop-all-button">STOP ALL</button>
        </div>
      </div>

      <div id="blocked-banner">All downloads are blocked. No network activity. Click "Unblock" to allow downloads again.</div>

      <div id="sessions-container">
        <div id="no-sessions">No active download sessions.</div>
      </div>
    </div>

    <script src="idb-fs.js"></script>
    <script src="manager.js"></script>
  </body>
</html>
